apiVersion: v1
kind: ConfigMap

metadata:
  name: fastapi-config

data:
  APP_ENV: "development"

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi

          image: aniket24122000/fastapi-demo:v5

          command: ["uvicorn"]

          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"

          ports:
            - containerPort: 8000

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: fastapi-config
                  key: APP_ENV

---
apiVersion: v1
kind: Service

metadata:
  name: fastapi-service

spec:
  type: NodePort

  selector:
    app: fastapi

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080